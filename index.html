<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo trang thông tin cá nhân</title>
<style>
  :root{--accent:#4f46e5;--accent2:#7c3aed;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,#eef2ff,#f5f3ff);min-height:100vh;padding:24px 14px 40px}
  .wrap{max-width:820px;margin:0 auto}
  .hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    border-radius:20px 20px 0 0;padding:28px 24px;text-align:center}
  .hero h1{margin:0;font-size:24px;letter-spacing:.5px}
  .hero p{margin:6px 0 0;opacity:.85;font-size:14px}
  .card{background:#fff;border-radius:0 0 20px 20px;padding:28px 24px;
    box-shadow:0 14px 40px rgba(79,70,229,.15)}
  .grid{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}

  /* Cột ảnh */
  .photo-col{text-align:center}
  .photo-box{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:3/4;
    border:2px dashed #c7c9f5;border-radius:16px;background:#f8f9ff;cursor:pointer;overflow:hidden;
    transition:.2s;position:relative}
  .photo-box:hover{border-color:var(--accent);background:#f1f2ff}
  .photo-box img{width:100%;height:100%;object-fit:cover;display:none}
  .placeholder{color:var(--muted);font-size:14px;padding:12px}
  .placeholder svg{width:44px;height:44px;stroke:var(--accent);margin-bottom:8px}
  .btn-ghost{margin-top:12px;width:100%;padding:10px;font-size:15px;border:1.5px solid var(--accent);
    color:var(--accent);background:#fff;border-radius:10px;cursor:pointer;font-weight:600}
  .btn-ghost:hover{background:#f1f2ff}

  /* Các ô nhập */
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field.full{grid-column:1/-1}
  .field label{display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:6px}
  .field label b{color:#e11d48}
  .field input,.field select{width:100%;padding:12px 14px;font-size:16px;font-family:inherit;color:var(--ink);
    border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:.15s}
  .field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(79,70,229,.12)}

  .btn{display:block;width:100%;margin-top:26px;padding:15px;font-size:17px;font-weight:700;color:#fff;border:0;
    border-radius:12px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 8px 20px rgba(79,70,229,.35);transition:.15s}
  .btn:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.6;cursor:wait}
  #msg{text-align:center;margin-top:14px;font-size:15px;font-weight:600;min-height:20px}

  @media(max-width:640px){
    .grid{grid-template-columns:1fr;gap:20px}
    .photo-col{max-width:220px;margin:0 auto;width:100%}
    .fields{grid-template-columns:1fr}
    .hero h1{font-size:20px}
    .card{padding:22px 16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>THÔNG TIN CÁ NHÂN</h1>
    <p>Điền thông tin, chọn ảnh rồi bấm tạo file</p>
  </header>

  <main class="card">
    <div class="grid">
      <div class="photo-col">
        <label class="photo-box" for="photo">
          <img id="preview" alt="Ảnh thẻ">
          <div class="placeholder" id="ph">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
            <div>Chạm để chọn ảnh thẻ</div>
          </div>
        </label>
        <input type="file" id="photo" accept="image/*" hidden>
        <button type="button" class="btn-ghost" id="pick">Chọn ảnh từ thiết bị</button>
      </div>

      <div class="fields">
        <div class="field full"><label for="hoten">Họ và tên <b>*</b></label><input type="text" id="hoten" placeholder="Nguyễn Ngọc Hạt" autocomplete="name"></div>
        <div class="field"><label for="ngaysinh">Ngày sinh</label><input type="text" id="ngaysinh" placeholder="27/8/2009"></div>
        <div class="field"><label for="gioitinh">Giới tính</label><select id="gioitinh"><option>Nữ</option><option>Nam</option></select></div>
        <div class="field full"><label for="diachi">Địa chỉ nhà</label><input type="text" id="diachi" autocomplete="street-address"></div>
        <div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="email"></div>
        <div class="field"><label for="sdt">SĐT</label><input type="tel" id="sdt" autocomplete="tel"></div>
        <div class="field"><label for="uocmo">Ước mơ</label><input type="text" id="uocmo"></div>
        <div class="field"><label for="sothich">Sở thích</label><input type="text" id="sothich"></div>
      </div>
    </div>

    <button class="btn" id="tao">Tạo file thông tin</button>
    <div id="msg"></div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// Tên file: lấy 2 từ cuối, bỏ dấu -> NgocHat, MaiQuynh
function fileName(full){
  const w = full.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/g,"d").replace(/Đ/g,"D")
    .replace(/[^a-zA-Z\s]/g,"").trim().split(/\s+/).filter(Boolean);
  return w.slice(-2).map(x=>x[0].toUpperCase()+x.slice(1).toLowerCase()).join("") || "ThongTin";
}

// Thu nhỏ ảnh cho file nhẹ, đổi thành base64 để nhúng thẳng vào HTML
function imgToDataURL(file){
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => {
      const max = 600, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = fail;
    img.src = URL.createObjectURL(file);
  });
}

function setMsg(text, ok){ const m = $("msg"); m.style.color = ok ? "#16a34a" : "#e11d48"; m.textContent = text; }

$("pick").onclick = () => $("photo").click();
$("photo").onchange = e => {
  const f = e.target.files[0];
  if(f){
    $("preview").src = URL.createObjectURL(f);
    $("preview").style.display = "block";
    $("ph").style.display = "none";
  }
};

$("tao").onclick = async () => {
  const hoten = $("hoten").value.trim(), f = $("photo").files[0];
  if(!hoten){ setMsg("Vui lòng nhập Họ và tên.", false); $("hoten").focus(); return; }
  if(!f){ setMsg("Vui lòng chọn ảnh.", false); return; }
  setMsg("", true);
  $("tao").disabled = true; $("tao").textContent = "Đang tạo...";

  try{
    const dataURL = await imgToDataURL(f);
    const val = id => $(id).value.trim() || "—";
    const rows = [
      ["Họ và tên", hoten], ["Ngày sinh", val("ngaysinh")],
      ["Giới tính", $("gioitinh").value], ["Địa chỉ nhà", val("diachi")],
      ["Email", val("email")], ["SĐT", val("sdt")],
      ["Ước mơ", val("uocmo")], ["Sở thích", val("sothich")]
    ];
    const tr = rows.map((r,i)=>
      "<tr>" + (i===0 ? `<td class="photo-cell" rowspan="8"><img src="${dataURL}" alt="Ảnh thẻ cá nhân"></td>` : "")
      + `<td class="label">${r[0]}</td><td class="val">${esc(r[1])}</td></tr>`).join("\n");

    const html = `<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thông tin cá nhân - ${esc(hoten)}</title>
<style>
:root{--accent:#4f46e5;--accent2:#7c3aed}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;
  font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#1f2937;background:linear-gradient(135deg,#eef2ff,#f5f3ff)}
.card{width:100%;max-width:760px;background:#fff;border-radius:22px;overflow:hidden;
  box-shadow:0 18px 50px rgba(79,70,229,.18)}
.top{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;text-align:center;padding:30px 20px}
.top h1{margin:0;font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;opacity:.85}
.top h2{margin:10px 0 0;font-size:30px;font-weight:700}
table{width:100%;border-collapse:collapse}
td{padding:15px 20px;border-bottom:1px solid #eef0f6;vertical-align:middle}
tr:last-child td{border-bottom:0}
.photo-cell{width:240px;text-align:center;background:#f8f9ff;border-right:1px solid #eef0f6;border-bottom:0;padding:26px}
.photo-cell img{width:170px;height:215px;object-fit:cover;border-radius:16px;border:4px solid #fff;
  box-shadow:0 8px 22px rgba(79,70,229,.28)}
.label{width:140px;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--accent)}
.val{font-size:16px;font-weight:500;word-break:break-word}
@media(max-width:600px){
  table,tbody,tr,td{display:block;width:100%}
  .photo-cell{width:100%;border-right:0;border-bottom:1px solid #eef0f6}
  .label{padding:14px 20px 0;border-bottom:0}
  .val{padding:4px 20px 14px}
  .top h2{font-size:24px}
}
@media print{body{background:#fff;padding:0}.card{box-shadow:none}}
</style></head><body>
<div class="card">
  <div class="top"><h1>Thông tin cá nhân</h1><h2>${esc(hoten)}</h2></div>
  <table>
${tr}
  </table>
</div>
</body></html>`;

    const name = fileName(hoten);
    const blob = new Blob([html], {type:"text/html"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name + ".html"; a.click();
    setMsg("Đã tạo file " + name + ".html", true);
  }catch(err){
    setMsg("Có lỗi khi xử lý ảnh, hãy thử chọn ảnh khác.", false);
  }
  $("tao").disabled = false; $("tao").textContent = "Tạo file thông tin";
};
</script>
</body>
</html>
