<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo trang thông tin cá nhân</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f7f6;margin:30px 10px}
  h2{text-align:center;color:#333}
  table{width:650px;max-width:100%;margin:0 auto;border-collapse:collapse;background:#fff;box-shadow:0 4px 8px rgba(0,0,0,.1);table-layout:fixed}
  th,td{border:1px solid #b0b0b0;padding:10px 12px;vertical-align:middle}
  .photo-cell{text-align:center;width:180px;background:#fafafa}
  .photo-cell img{width:140px;height:170px;object-fit:cover;border:1px solid #ccc;display:none;margin-bottom:8px}
  .photo-cell input{width:100%;font-size:13px}
  .label{font-weight:bold;color:#2c3e50;width:110px}
  input[type=text],input[type=email],input[type=tel],select{width:100%;box-sizing:border-box;padding:8px;font-size:15px}
  .btn{display:block;margin:20px auto;padding:12px 28px;font-size:16px;background:#2c7be5;color:#fff;border:0;border-radius:6px;cursor:pointer}
  #msg{text-align:center;margin-top:10px}
</style>
</head>
<body>

<h2>NHẬP THÔNG TIN CÁ NHÂN</h2>

<table>
  <tr>
    <td class="photo-cell" rowspan="8">
      <img id="preview" alt="Ảnh thẻ">
      <input type="file" id="photo" accept="image/*">
    </td>
    <td class="label">Họ và tên</td><td><input type="text" id="hoten"></td>
  </tr>
  <tr><td class="label">Ngày sinh</td><td><input type="text" id="ngaysinh" placeholder="27/8/2009"></td></tr>
  <tr><td class="label">Giới tính</td><td><select id="gioitinh"><option>Nữ</option><option>Nam</option></select></td></tr>
  <tr><td class="label">Địa chỉ nhà</td><td><input type="text" id="diachi"></td></tr>
  <tr><td class="label">Email</td><td><input type="email" id="email"></td></tr>
  <tr><td class="label">Sdt</td><td><input type="tel" id="sdt"></td></tr>
  <tr><td class="label">Ước mơ</td><td><input type="text" id="uocmo"></td></tr>
  <tr><td class="label">Sở thích</td><td><input type="text" id="sothich"></td></tr>
</table>

<button class="btn" id="tao">Tạo file thông tin</button>
<div id="msg"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// Tên file: lấy 2 từ cuối, bỏ dấu -> NgocHat, MaiQuynh
function fileName(full){
  const w = full.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/g,"d").replace(/Đ/g,"D")
    .replace(/[^a-zA-Z\s]/g,"").trim().split(/\s+/).filter(Boolean);
  return w.slice(-2).map(x=>x[0].toUpperCase()+x.slice(1).toLowerCase()).join("") || "ThongTin";
}

// Thu nhỏ ảnh cho file nhẹ, rồi đổi thành chuỗi base64 (nhúng thẳng vào HTML)
function imgToDataURL(file){
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => {
      const max = 500, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = fail;
    img.src = URL.createObjectURL(file);
  });
}

$("photo").onchange = e => {
  const f = e.target.files[0];
  if(f){ $("preview").src = URL.createObjectURL(f); $("preview").style.display = "block"; }
};

$("tao").onclick = async () => {
  const hoten = $("hoten").value.trim(), f = $("photo").files[0];
  if(!hoten){ $("msg").style.color="#c0392b"; $("msg").textContent="Vui lòng nhập Họ và tên."; return; }
  if(!f){ $("msg").style.color="#c0392b"; $("msg").textContent="Vui lòng chọn ảnh."; return; }
  $("msg").textContent = "";

  const dataURL = await imgToDataURL(f);
  const rows = [
    ["Họ và tên", hoten], ["Ngày sinh", $("ngaysinh").value],
    ["Giới tính", $("gioitinh").value], ["Địa chỉ nhà", $("diachi").value],
    ["Email", $("email").value], ["Sdt", $("sdt").value],
    ["Ước mơ", $("uocmo").value], ["Sở thích", $("sothich").value]
  ];
  const tr = rows.map((r,i)=>
    "<tr>" + (i===0 ? `<td class="photo-cell" rowspan="8"><img src="${dataURL}" alt="Ảnh thẻ cá nhân"></td>` : "")
    + `<td class="label">${r[0]}</td><td>${esc(r[1])}</td></tr>`).join("\n");

  const html = `<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thông tin cá nhân - ${esc(hoten)}</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7f6;margin-top:50px}
h2{text-align:center;color:#333;margin-bottom:25px}
table{width:650px;max-width:100%;margin:0 auto;border-collapse:collapse;background:#fff;box-shadow:0 4px 8px rgba(0,0,0,.1)}
th,td{border:1px solid #b0b0b0;padding:12px 15px;vertical-align:middle}
.photo-cell{text-align:center;width:180px;background:#fafafa}
.photo-cell img{width:140px;height:170px;object-fit:cover;border:1px solid #ccc}
.label{font-weight:bold;color:#2c3e50;width:140px}
</style></head><body>
<h2>THÔNG TIN CÁ NHÂN</h2>
<table>
${tr}
</table>
</body></html>`;

  const name = fileName(hoten);
  const blob = new Blob([html], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name + ".html"; a.click();
  $("msg").style.color = "#27ae60";
  $("msg").textContent = "Đã tạo file " + name + ".html";
};
</script>

</body>
</html>
